<div class="min-h-screen flex items-center justify-center bg-white dark:bg-gray-800 transition-colors duration-500">
  <div class="text-center">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100 mb-4">
      {{ isDarkMode ? 'Dark Mode' : 'Light Mode' }}
    </h1>
    <button
      (click)="toggleTheme()"
      class="px-4 py-2 bg-blue-500 dark:bg-blue-700 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 dark:hover:bg-blue-900 transition-colors duration-300"
    >
      Toggle Theme
    </button>
  </div>
</div>
